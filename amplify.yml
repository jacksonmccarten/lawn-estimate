version: 1
applications:
  - appRoot: apps/dashboard
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - (cd ../.. && npm ci)
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
  - appRoot: apps/widget
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22
            - (cd ../.. && npm ci)
        build:
          commands:
            # The widget reads LQ_* on the server at request time; Amplify only
            # passes env vars to the SSR runtime through .env.production.
            # `|| true`: with none of them set, grep finds nothing and would fail the build.
            - env | grep -e '^LQ_' -e '^NEXT_PUBLIC_MAPBOX_TOKEN=' >> .env.production || true
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
